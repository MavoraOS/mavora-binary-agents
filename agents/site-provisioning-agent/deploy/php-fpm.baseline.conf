; Mavora Site Provisioning Agent — php-fpm baseline pool config (SP-T-405)
;
; Spec: impl/13-devops-integration.md §18.1 (per-subsite resource caps)
;       W9.md SP-T-405 (php-fpm pm.max_children baseline, config-tunable)
;
; Usage:
;   This is a BASELINE config for the php-fpm pool used by the WP Multisite network
;   on a Mavora provisioning VPS. Copy to:
;     /etc/php/{VERSION}/fpm/pool.d/mavora-wp.conf
;   and restart php-fpm:
;     sudo systemctl restart php{VERSION}-fpm
;
;   Replace {VERSION} with your PHP version (e.g. 8.2).
;   Replace {WEBROOT} with the WordPress root (e.g. /var/www).
;
; Tuning:
;   pm.max_children is the primary lever for per-VPS resource caps.
;   Default 10 = conservative baseline for a shared Mavora-provided VPS.
;   Increase for larger VPS / fewer subsites. The admission gate
;   (SP-BR-20 / RC-5) blocks new provisioning when disk>85%/RAM>90%/load5>cores×1.5.
;
; Security:
;   - Pool runs as www-data (NOT mavora-agent, NOT root).
;   - The wp-safe helper drops to www-data before invoking WP-CLI.
;   - chroot is NOT configured here (VPS-level isolation is sufficient for Phase 1).
;   - No expose_php / fastcgi_index tricks.

[mavora-wp]

; Process owner (must match nginx fastcgi_pass socket ownership)
user  = www-data
group = www-data

; Listen socket (use socket not TCP to avoid extra syscall)
; Match this path with the nginx vhost fastcgi_pass directive (PHP_SOCKET above).
listen = /run/php/php8.2-fpm.sock   ; update VERSION as needed
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; Process manager: dynamic (spawn on demand, min idle, max cap)
pm = dynamic

; BASELINE: 10 max children for a shared Mavora-provided VPS.
; Increase proportionally: e.g. 25 for a 4-vCPU 8GB VPS with ≤15 subsites.
; Keep memory margin: each WP process ≈ 32–64 MiB; plan for pm.max_children * 64 MiB.
pm.max_children     = 10
pm.start_servers    = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 5

; Recycle workers periodically to avoid PHP memory leaks
pm.max_requests = 500

; PHP request timeout (must be > nginx fastcgi_read_timeout)
request_terminate_timeout = 60s

; Error log (write to system log — zap scrubber does not apply here,
; but do not log WP App Passwords or any Mavora bearer token in PHP code)
php_admin_value[error_log]   = /var/log/php8.2-fpm-mavora.log
php_admin_flag[log_errors]   = on
php_admin_value[display_errors] = off

; Document root restriction (defense-in-depth)
php_admin_value[open_basedir]  = /var/www:/tmp:/usr/share/php

; Session hardening
php_admin_value[session.save_path] = /var/lib/php/sessions
